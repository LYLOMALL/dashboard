<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>صفحه لاگین</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-container">
    <h2>ورود کاربران</h2>
    <form id="loginForm">
      <input type="text" id="fullName" placeholder="نام کامل" required />
      <input type="text" id="lastName" placeholder="تخلص" required />
      <input type="text" id="passport" placeholder="شماره پاسپورت" required />
      <input type="text" id="caseNumber" placeholder="شماره کیس" required />
      <input type="password" id="accessCode" placeholder="کد دسترسی" required />
      <button type="submit">ورود</button>
    </form>
    <p id="error" class="error-msg"></p>
  </div>

  <script src="login.js"></script>
</body>
</html>
