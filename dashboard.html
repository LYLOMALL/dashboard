<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>داشبورد</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="dashboard-header">
    داشبورد کاربران
  </header>

  <div class="dashboard-container">
    <nav class="sidebar">
      <button id="btn1" class="active">نتیجه نهایی</button>
      <button id="btn2">آپلود پاسپورت</button>
      <button id="btn3">آپلود عکس پرسونلی</button>
      <button id="btn4">تأیید سازمان ملل</button>
      <button id="btn5">خروج</button>
    </nav>

    <main class="main-content" id="mainContent">
      <iframe src="" frameborder="0" style="width:100%;height:100%;min-height:400px;"></iframe>
    </main>
  </div>

  <footer class="dashboard-footer">
    © 2025 Your Company Name
  </footer>

  <script>
    // بارگذاری اطلاعات یوزر از sessionStorage
    const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
    if (!user) {
      // اگر یوزری وارد نشده باشد به صفحه لاگین برمی‌گردد
      window.location.href = 'index.html';
    }

    const links = user.dashboardLinks;
    const iframe = document.querySelector('iframe');
    const buttons = document.querySelectorAll('.sidebar button');

    // نمایش اولین لینک به صورت پیش‌فرض
    iframe.src = links.btn1;

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        // حذف کلاس فعال از همه دکمه‌ها
        buttons.forEach(b => b.classList.remove('active'));
        // افزودن کلاس فعال به دکمه کلیک شده
        btn.classList.add('active');

        // بارگذاری لینک مربوط به دکمه
        const linkKey = btn.id;
        const url = links[linkKey];

        if (url === 'https://example.com/logout') {
          // عملیات خروج
          sessionStorage.removeItem('loggedInUser');
          window.location.href = 'index.html';
          return;
        }

        iframe.src = url;
      });
    });
  </script>

</body>
</html>
